<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HAPPY BIRTHDAY! 🎂💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 40%, #f7d6e0 70%, #f2c6de 100%);
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-hover: rgba(255, 255, 255, 0.95);
      --accent-color: #ff9ebb;
      --accent-dark: #e86a92;
      --text-main: #6b5262;
      --text-muted: #a38599;
      --font-title: 'Fredoka', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px;'><text y='24'>🌸</text></svg>"), auto !important;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* --- SHINING SPARKLE TRAIL --- */
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 1rem;
      z-index: 9999;
      animation: sparkleFade 0.8s linear forwards;
    }

    @keyframes sparkleFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.3) rotate(45deg);
      }
    }

    /* --- FLOODING HEART CONFETTI --- */
    .flood-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 1.8rem;
      user-select: none;
      animation: heartFlood 2s cubic-bezier(0.12, 0.8, 0.32, 1) forwards;
    }

    @keyframes heartFlood {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1.6) rotate(var(--rot));
      }
    }

    /* --- BIRTHDAY INTRO OVERLAY --- */
    .intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffe3e8 0%, #f7d6e0 50%, #f2c6de 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      text-align: center;
      padding: 1.5rem;
      transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s;
    }

    .intro-overlay.hidden {
      opacity: 0;
      transform: scale(1.05);
      visibility: hidden;
      pointer-events: none;
    }

    .intro-title {
      font-family: var(--font-title);
      font-size: 2.6rem;
      background: linear-gradient(45deg, #e86a92, #ff85a2, #d85a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.8rem;
      filter: drop-shadow(2px 4px 10px rgba(255, 255, 255, 0.9));
      animation: pulseTitle 2s infinite ease-in-out;
      line-height: 1.25;
      max-width: 600px;
      padding: 0 1rem;
    }

    @keyframes pulseTitle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .big-envelope {
      font-size: 5.5rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.75);
      padding: 1.2rem 2.2rem;
      border-radius: 35px;
      box-shadow: 0 15px 35px rgba(232, 106, 146, 0.25);
      border: 2px solid #ffffff;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .big-envelope:hover, .big-envelope:active {
      transform: scale(1.1) rotate(-3deg);
      background: #ffffff;
      box-shadow: 0 20px 40px rgba(232, 106, 146, 0.35);
    }

    .click-hint {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: var(--accent-dark);
      font-weight: 700;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* --- FLOATING SIDE PHOTOS --- */
    .side-photo {
      position: absolute;
      width: 100px;
      height: 125px;
      background: #ffffff;
      padding: 5px 5px 16px 5px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(216, 90, 138, 0.18);
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      top: 40vh !important;
      left: 50% !important;
      right: auto !important;
      transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      transition: all 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .side-photo.show-photo {
      opacity: 0.88;
    }

    .side-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    /* Desktop Positions */
    @media (min-width: 1025px) {
      .side-photo {
        width: 130px;
        height: 160px;
      }
      .photo-1.show-photo { top: 120px !important; left: 2% !important; transform: translate(0, 0) rotate(-8deg); }
      .photo-2.show-photo { top: 450px !important; left: 2% !important; transform: translate(0, 0) rotate(6deg); }
      .photo-5.show-photo { top: 780px !important; left: 2% !important; transform: translate(0, 0) rotate(-5deg); }
      .photo-6.show-photo { top: 1110px !important; left: 2% !important; transform: translate(0, 0) rotate(7deg); }

      .photo-3.show-photo { top: 220px !important; left: auto !important; right: 2% !important; transform: translate(0, 0) rotate(7deg); }
      .photo-4.show-photo { top: 550px !important; left: auto !important; right: 2% !important; transform: translate(0, 0) rotate(-6deg); }
      .photo-7.show-photo { top: 880px !important; left: auto !important; right: 2% !important; transform: translate(0, 0) rotate(5deg); }
      .photo-8.show-photo { top: 1210px !important; left: auto !important; right: 2% !important; transform: translate(0, 0) rotate(-7deg); }
    }

    /* Mobile Phone Positions */
    @media (max-width: 1024px) {
      .side-photo {
        width: 80px;
        height: 100px;
        padding: 4px 4px 12px 4px;
      }
      .photo-1.show-photo { top: 100px !important; left: 6px !important; transform: translate(0, 0) rotate(-10deg); }
      .photo-2.show-photo { top: 400px !important; left: 6px !important; transform: translate(0, 0) rotate(8deg); }
      .photo-5.show-photo { top: 700px !important; left: 6px !important; transform: translate(0, 0) rotate(-6deg); }
      .photo-6.show-photo { top: 1000px !important; left: 6px !important; transform: translate(0, 0) rotate(9deg); }

      .photo-3.show-photo { top: 250px !important; left: auto !important; right: 6px !important; transform: translate(0, 0) rotate(10deg); }
      .photo-4.show-photo { top: 550px !important; left: auto !important; right: 6px !important; transform: translate(0, 0) rotate(-8deg); }
      .photo-7.show-photo { top: 850px !important; left: auto !important; right: 6px !important; transform: translate(0, 0) rotate(6deg); }
      .photo-8.show-photo { top: 1150px !important; left: auto !important; right: 6px !important; transform: translate(0, 0) rotate(-9deg); }
    }

    /* Background Floating Hearts */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 182, 193, 0.35);
      font-size: 1.5rem;
      animation: floatUp 12s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease 0.2s;
    }

    body.started header {
      opacity: 1;
      transform: translateY(0);
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 2.3rem;
      color: #d85a8a;
      margin-bottom: 0.3rem;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9);
    }

    header p {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Floating Music Controls */
    .music-badge {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 0.5rem 0.9rem;
      border-radius: 30px;
      box-shadow: 0 6px 18px rgba(232, 106, 146, 0.22);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s ease;
      opacity: 0;
      max-width: 85vw;
    }

    body.started .music-badge {
      opacity: 1;
    }

    #music-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .music-btn-action {
      background: #ffe3e8;
      border: none;
      padding: 0.25rem 0.55rem;
      border-radius: 12px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .music-btn-action:hover, .music-btn-action:active {
      background: #ffd1dc;
    }

    /* Grid & Cards Reveal with Mini Photo Side Thumbnails */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 980px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 1.1rem 1.2rem;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 22px rgba(244, 180, 202, 0.18);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s, box-shadow 0.3s, opacity 0.6s ease, filter 0.6s ease;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.9rem;
      min-height: 115px;
      opacity: 0;
      transform: translateY(30px);
      filter: blur(4px);
    }

    .card-thumb-frame {
      width: 60px;
      height: 72px;
      flex-shrink: 0;
      background: #ffffff;
      padding: 3px 3px 12px 3px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(216, 90, 138, 0.2);
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
    }

    .card:hover .card-thumb-frame {
      transform: rotate(2deg) scale(1.05);
    }

    .card-thumb-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      height: 100%;
    }

    .card.last-centered-card {
      grid-column: 1 / -1;
      justify-self: center;
      max-width: 380px;
      width: 100%;
    }

    .card.appear {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .card:hover, .card:active {
      transform: translateY(-5px) scale(1.02) !important;
      background: var(--card-hover);
      box-shadow: 0 15px 28px rgba(232, 106, 146, 0.25);
      border-color: rgba(255, 255, 255, 1);
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 500;
      color: #6d415b;
      line-height: 1.35;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 0.7rem;
      font-size: 0.8rem;
      color: var(--accent-dark);
      font-weight: 700;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(232, 106, 146, 0.2);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 3000;
      padding: 1.2rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 26px;
      max-width: 480px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2rem 1.6rem;
      box-shadow: 0 20px 45px rgba(216, 90, 138, 0.22);
      position: relative;
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid #fff;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #ffe3e8;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .close-btn:hover, .close-btn:active {
      background: #ffd1dc;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.25rem;
      color: #d85a8a;
      margin-bottom: 1.1rem;
      padding-right: 1.8rem;
      line-height: 1.3;
    }

    .modal-body {
      font-size: 0.98rem;
      line-height: 1.75;
      color: #5c4554;
      white-space: pre-wrap;
      font-weight: 500;
    }

    footer {
      margin-top: 3.2rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease 1s;
    }

    body.started footer {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="side-photo photo-1">

  <script>
    // --- SPARKLE TRAIL ON POINTER / TOUCH ---
    const sparkleEmojis = ['✨', '💖', '🌸', '🌟'];
    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = x + 'px';
      sparkle.style.top = y + 'px';
      sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 800);
    }

    let lastSparkleTime = 0;
    function handlePointerMove(e) {
      const now = Date.now();
      if (now - lastSparkleTime > 60) {
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        if (x && y) {
          createSparkle(x, y);
          lastSparkleTime = now;
        }
      }
    }
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove);

    // --- MASSIVE 2-SECOND HEART FLOOD ON OPEN ---
    const floodEmojis = ['🌸', '💖', '✨', '💕', '🧁', '🎈', '💌', '🌹', '❤️', '🧸'];
    function floodHeartsOnOpening(x, y) {
      const count = 45;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'flood-heart';
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.textContent = floodEmojis[Math.floor(Math.random() * floodEmojis.length)];
          
          const angle = Math.random() * Math.PI * 2;
          const distance = 120 + Math.random() * 280;
          const dx = Math.cos(angle) * distance + 'px';
          const dy = (Math.sin(angle) * distance - 80) + 'px';
          const rot = (Math.random() * 500 - 250) + 'deg';
          
          p.style.setProperty('--dx', dx);
          p.style.setProperty('--dy', dy);
          p.style.setProperty('--rot', rot);

          document.body.appendChild(p);
          setTimeout(() => p.remove(), 2000);
        }, i * 35);
      }
    }

    // --- CARDS DATA ---
    const cardsData = [
      {
        title: "Open when... you miss me",
        message: "Hey love,\n\nIf you’re opening this, I’m guessing the distance is making things feel a little quiet today. I wish I could go next to you, whisper in your ear, and tell you everything is going to be okay. Close your eyes for a second, breathe, please know that I love you so, so much. I miss you so much more and please know that we would be coming back to each other always, hm? I miss you so much! We would be making it up to each other, promise. Puppy got you~"
      },
      {
        title: "Open when... you’re having a tough or exhausting day",
        message: "Take a deep breath and drop your shoulders for me. You’ve been holding so much tension today, haven’t you?\n\nI know today was heavy, but you made it through. I’m so so so so proud of how hard you try every single day. You don’t have to be strong right now, my dearest. Just rest. Wrap yourself in a soft blanket, get comfortable, and let puppy hold space for you. You are loved, you are safe, and tomorrow is a fresh start. You’re doing so good, angel."
      },
      {
        title: "Open when... the distance feels too heavy today",
        message: "I know. Some days feel like too much, and all you want is to just reach out and touch puppy close. I feel it too.\n\nBut remember this, distance only measures certain space, not how close our hearts are. Every single day that passes is one day closer to the moment I get to wrap my arms around you and never let go. Hang in there with me, okay? We are building something beautiful together. We would be okay, angel baby."
      },
      {
        title: "Open when... you can't sleep and it’s late at night",
        message: "Hey sleepyhead, why are you still awake? Come snuggle back to pupppyyyy!\n\nPut your phone down after reading this, close your eyes, and think about us sitting under a quiet night sky with no noise around us. Imagine my hand softly stroking your hair until you drift off. Just warm warm hugs and pets coming onto your way. You can breathe, let go of all the thoughts running through your mind. I’ll be right here, things will be alright, precious. Take care and rest well, my treasure."
      },

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
